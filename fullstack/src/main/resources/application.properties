# ==============================
# SERVER
# ==============================
server.port=${PORT:8080}
# ==============================
# DATABASE - PostgreSQL (Render)
# ==============================
spring.datasource.url=jdbc:${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# No need to set username/password separately ? they are inside DATABASE_URL

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT
# ==============================
jwt.secret=7oOU7N6OpCNVL+hq+0pNcc4q4Nc/Vllq87eMj77bsi8=
jwt.expiration-ms=86400000

# ==============================
# CORS (Frontend URL from Render)
# ==============================
app.cors.allowed-origins=${FRONTEND_URL}

# ==============================
# FILE UPLOAD
# ==============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.upload-dir=uploads/resumes

# ==============================
# MAIL (use Render env variables)
# ==============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==============================
# JSON CONFIG
# ==============================
spring.jackson.serialization.write-dates-as-timestamps=false

# ==============================
# SECURITY FLAG
# ==============================
app.security.enabled=true

# ==============================
# LOGGING
# ==============================
logging.level.root=INFO

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation=TRACE

logging.level.com.ims.fullstack.service=DEBUG

logging.level.org.springframework.security=TRACE
logging.level.com.ims.fullstack.security=TRACE

logging.level.com.ims.fullstack.security.JwtAuthenticationFilter=TRACE

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# ==============================
# GEMINI API (optional, for ATS)
# ==============================
gemini.api.key=${GEMINI_API_KEY}